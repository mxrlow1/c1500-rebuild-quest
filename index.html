<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>C1500 Rebuild Quest</title>
<style>
  :root {
    --bg: #071018;
    --panel: #101a27;
    --panel2: #162334;
    --line: #26384d;
    --text: #e8f0f7;
    --muted: #8aa0b8;
    --accent: #3ee0a4;
    --accent2: #5aa8ff;
    --warn: #ffb020;
    --danger: #ff6b6b;
    --gold: #f4c95d;
    --shadow: 0 12px 40px rgba(0,0,0,.35);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { max-width: 760px; margin: 0 auto; padding: 16px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: linear-gradient(180deg, #142335, #0d1723); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 20;
  }
  .brand { display: flex; gap: 10px; align-items: center; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: radial-gradient(circle at 30% 30%, #62ffc5, #168a62); display:grid; place-items:center; font-weight:800; color:#052016; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .xpwrap { min-width: 140px; }
  .xpbar { height: 8px; background: #1b2b3c; border-radius: 99px; overflow: hidden; }
  .xpfill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #8cffd3); }
  .xplabel { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
  .nav {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 14px 0;
  }
  .nav button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px;
    color: var(--muted); cursor: pointer; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav button.active { color: #062017; background: var(--accent); border-color: transparent; font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: #1b2d40; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .btn {
    background: var(--accent); color: #052016; border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 800; cursor: pointer;
  }
  .btn.ghost { background: #1b2d40; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.warn { background: var(--warn); color: #2a1b00; }
  .btn.danger { background: #3a1c22; color: #ffb4b4; border: 1px solid #5a2a32; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  select, input[type=text], textarea {
    width: 100%; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
  }
  textarea { min-height: 90px; resize: vertical; }
  .phase { display:flex; justify-content:space-between; gap:10px; align-items:center; padding: 12px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
  .phase h3 { margin: 0; font-size: 15px; }
  .phase p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #1d3348; color: var(--accent); }
  .badge.done { background: #143528; color: #7dffc4; }
  .stephead { display:flex; justify-content:space-between; align-items:flex-start; gap: 10px; }
  .check {
    width: 44px; height: 44px; min-width: 44px; border-radius: 10px; font-size: 20px; border: 2px solid var(--accent); background: transparent; cursor: pointer;
    display:grid; place-items:center; flex: 0 0 auto;
  }
  .check.on { background: var(--accent); color: #052016; font-weight: 900; }
  .warnbox { background: #2a2210; border: 1px solid #5a4618; color: #ffd98a; padding: 10px 12px; border-radius: 12px; font-size: 13px; margin: 10px 0; }
  .tip { background: #102433; border: 1px solid #21435d; color: #b9ddff; padding: 10px 12px; border-radius: 12px; font-size: 13px; margin: 10px 0; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .photos img, .phadd, .phph {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: #0c1622;
  }
  .phadd { display:grid; place-items:center; color: var(--muted); cursor: pointer; font-size: 28px; }
  .phph { display:grid; place-items:center; color: var(--muted); font-size: 12px; }
  .toast.err { background: #3a1c22; color: #ffd0d0; border-color: #7a3440; border-radius: 14px; max-width: 92vw; text-align: center; }
  .hidden { display: none !important; }
  .rank { font-weight: 800; color: var(--gold); }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #123325; color: #c8ffdf; border: 1px solid #2d6a4f; padding: 10px 14px; border-radius: 999px; z-index: 50;
  }
  ul.clean { margin: 8px 0 0 18px; padding: 0; color: #d5e4f1; }
  ul.clean li { margin: 6px 0; }
  .specgrid { display:grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 14px; }
  .specgrid span:nth-child(odd) { color: var(--muted); }
  .logo { flex: 0 0 auto; }
  .stepdone { width: 100%; margin-top: 12px; min-height: 48px; }
  .card[id^="step-"] { scroll-margin-top: 170px; }
  .banner { background: #102433; border: 1px solid #21435d; color: #b9ddff; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 13px; }
  .banner .row { margin-top: 8px; }
  @media (max-width: 400px) { .xpwrap { min-width: 118px; } }
  .nav { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .nav button { font-size: 12px; padding: 12px 0; }
  input[type=number] { width: 100%; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  details.kit { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; }
  details.kit > summary { cursor: pointer; padding: 12px; font-weight: 700; list-style: none; min-height: 44px; display: flex; align-items: center; }
  details.kit > summary::-webkit-details-marker { display: none; }
  details.kit > summary::after { content: "▸"; margin-left: auto; color: var(--muted); }
  details.kit[open] > summary::after { content: "▾"; }
  .kitbody { padding: 0 12px 12px; }
  .prow { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .prow input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
  .prow small { color: var(--muted); display: block; font-size: 12px; margin-top: 3px; line-height: 1.45; }
  .prow.have .pname { opacity: .6; }
  .prow.have .pn { text-decoration: line-through; }
  .pprice { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; color: #d5e4f1; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 99px; background: #1d3348; color: #9fc7ff; margin-right: 4px; white-space: nowrap; }
  .tag.must { background: #3a1c22; color: #ffb4b4; } .tag.worn { background: #2a2210; color: #ffd98a; }
  .tag.optional, .tag.nice { background: #1b2d40; color: var(--muted); } .tag.buy { background: #143528; color: #7dffc4; }
  .tag.rent { background: #1d2a48; color: #a9c4ff; } .tag.own { background: #20262e; color: #b8c4d0; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .totals > div { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .totals strong { font-size: 19px; }
  .btn.sm { padding: 9px 11px; font-size: 13px; min-height: 40px; }
  .helpers { margin: 10px 0; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .fgrid label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .fgrid small { color: #7f95ad; font-size: 11px; display: block; margin-top: 3px; line-height: 1.35; }
  #printCanvas { width: 100%; height: 260px; background: #0c1622; border: 1px solid var(--line); border-radius: 14px; touch-action: none; display: block; cursor: grab; }
  pre.code { white-space: pre-wrap; word-break: break-word; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 12px; max-height: 320px; overflow: auto; }
  .safety { background: #3a1c22; border: 1px solid #7a3440; color: #ffd0d0; padding: 12px; border-radius: 12px; font-size: 13px; margin: 10px 0; }
  .mat { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">94</div>
      <div>
        <h1>C1500 Rebuild Quest</h1>
        <div class="sub">1994 Chevy engine + trans walkthrough</div>
      </div>
    </div>
    <div class="xpwrap">
      <div class="rank" id="rankLabel">Grease Rookie</div>
      <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
      <div class="xplabel" id="xpLabel">0 XP</div>
    </div>
  </header>

  <nav class="nav">
    <button class="active" data-tab="home">Quest</button>
    <button data-tab="bay">Bay</button>
    <button data-tab="parts">Parts</button>
    <button data-tab="grok">Grok</button>
    <button data-tab="print">Print</button>
    <button data-tab="specs">Specs</button>
    <button data-tab="log">Log</button>
  </nav>

  <section id="tab-home"></section>
  <section id="tab-bay" class="hidden"></section>
  <section id="tab-parts" class="hidden"></section>
  <section id="tab-grok" class="hidden"></section>
  <section id="tab-print" class="hidden"></section>
  <section id="tab-specs" class="hidden"></section>
  <section id="tab-log" class="hidden"></section>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const PHASES = [
  {
    id: "setup",
    title: "Phase 0 — Garage Setup",
    blurb: "Build your loadout before a single bolt moves.",
    xp: 80,
    steps: [
      {
        id: "profile",
        title: "Lock in the truck build",
        why: "C1500 steps change with 2WD/4WD, auto vs manual, and which engine is in it.",
        do: [
          "Confirm year is 1994 C1500 (GMT400).",
          "Identify engine: most common is 5.7L TBI VIN K (L05). Also possible: 5.0L TBI VIN H or 4.3L V6.",
          "Note transmission: 4L60E is the usual auto. Some trucks have 4L80E or a manual.",
          "Note 2WD (C) vs 4WD (K). 4WD adds transfer case, front shaft, and extra brackets.",
          "Write mileage and symptoms: knock, smoke, low oil pressure, no reverse, overheating."
        ],
        warn: "Do not guess the engine. Check the 8th VIN digit or the RPO sticker in the glove box.",
        tip: "Photo the VIN plate, RPO sticker, engine pad, and transmission tag now. Future-you will thank you.",
        photo: true
      },
      {
        id: "safety",
        title: "Safety and workspace",
        why: "A falling GMT400 engine/trans combo can crush you. Setup is the cheapest insurance.",
        do: [
          "Level concrete or packed ground. No ramps-only work for this job.",
          "Rated jack stands under the frame, never under the oil pan or sheet metal.",
          "Engine hoist rated 2-ton minimum. These combos are heavy.",
          "Engine stand ready before the motor comes out.",
          "Fire extinguisher, safety glasses, gloves, drain pans, and a parts-label system.",
          "Disconnect the negative battery cable first on every work day."
        ],
        warn: "Never support the engine with a floor jack under the oil pan. You will crush the pan and pickup.",
        tip: "Rent the hoist and stand if buying both blows the budget. Harbor Freight coupons exist for a reason.",
        photo: true
      },
      {
        id: "tools",
        title: "Tool and consumable kit",
        why: "Most freeze-ups on this truck are rusted fasteners and missing 13/15/18mm coverage.",
        do: [
          "Sockets/wrenches: 10, 13, 14, 15, 18, 19, 21 mm plus SAE 1/2, 9/16, 5/8, 11/16, 3/4.",
          "Breaker bar, penetrating oil, torque wrench (in-lb and ft-lb), pry bar, pickle fork or ball-joint tool if 4WD.",
          "Fuel line disconnect tools for TBI quick-connects.",
          "Marker, zipper bags, painter tape, phone for photos before every connector comes off.",
          "Drain pans for coolant, oil, and ATF. They will all come out.",
          "Thread locker, RTV (sensor-safe where specified), assembly lube, Plastigage."
        ],
        warn: "Do not twist the TBI fuel lines like ordinary fittings until you know they are the correct disconnect style.",
        tip: "Take a panoramic photo of the engine bay before you touch anything. That picture is your wiring map.",
        photo: true
      }
    ]
  },
  {
    id: "pull",
    title: "Phase 1 — Pull Engine + Trans",
    blurb: "Clear the bay, support the mass, then lift. Slow is fast.",
    xp: 160,
    steps: [
      {
        id: "bayclear",
        title: "Topside disconnects",
        why: "Most “stuck engine” moments are one forgotten hose, ground, or A/C line.",
        do: [
          "Battery negative off. Relieve fuel pressure at the TBI schrader if equipped, then cap lines.",
          "Drain coolant. Remove upper/lower radiator hoses, fan shroud, and clutch fan if it blocks the lift.",
          "Remove air cleaner, ducts, and TBI connections: throttle cable, cruise, vacuum, and electrical plugs.",
          "Disconnect heater hoses, power steering lines at the pump if needed, and A/C compressor (leave system closed if you can unbolt the compressor and tie it aside without opening the lines).",
          "Unplug every sensor you can reach: CTS, knock, IAC, TPS, injectors, distributor, grounds.",
          "Remove the distributor cap or mark rotor-to-housing and housing-to-block if the cap stays on. Photo it."
        ],
        warn: "If you open A/C you need recovery equipment. Tie the charged compressor aside instead if possible.",
        tip: "Bag every fastener with a tape label: “fan shroud upper”, “TBI 13mm”, etc.",
        photo: true
      },
      {
        id: "under",
        title: "Underside disconnects",
        why: "The usual, easier C1500 approach: pull the engine alone out the top and drop the transmission from below. The engine by itself is shorter, clears the core support and cowl more easily, and needs less hoist reach. Pulling both as a unit also works but needs a steep tilt and more room.",
        do: [
          "Raise and stand the truck on the frame. Chock the rear wheels.",
          "Drain engine oil. If the trans is coming out, drain its fluid too (drop the pan, or use the drain plug if yours has one).",
          "Remove the trans dipstick tube now, while you can reach its upper bolt at the back of the engine. It is much harder to get to once things are half apart.",
          "Disconnect exhaust at the manifolds or Y-pipe. Penetrant first. Expect seized nuts.",
          "Remove starter, torque converter cover, and the converter-to-flexplate bolts. Rotate the engine to reach all of them. Mark converter to flexplate.",
          "Engine-only pull (usual): support the transmission with a jack and leave it on its crossmember for now. Loosen the bellhousing bolts; the last ones come out right before the lift.",
          "Trans out from below (after the engine is out, or now): mark and remove the driveshaft at the pinion flange, disconnect shift cable, NSBU/neutral switch plug, vehicle speed sensor, and cooler lines (cap them), then lower it on a transmission jack with the converter strapped in. On 4WD also remove the front shaft and support/remove the transfer case.",
          "As-a-unit alternative: leave the bellhousing bolted, do all the trans disconnects above, support the trans with a jack, and unbolt the crossmember and rear mount last."
        ],
        warn: "Do not let the converter slide off the input as the trans comes back. It can dump and smash a finger.",
        tip: "A rented transmission jack makes dropping the trans from below a one-person job instead of a balancing act on a floor jack.",
        photo: true
      },
      {
        id: "lift",
        title: "Unbolt mounts and lift",
        why: "The hoist should take the weight before the last mount bolt comes out.",
        do: [
          "Attach a rated chain or balancer to solid points (heads or proper lift brackets). No intake-only lift on a rusty TBI manifold if it looks cracked.",
          "Take slight hoist tension. Remove engine mount through-bolts.",
          "Engine-only (usual): with the trans supported on its jack, remove the remaining bellhousing bolts. Pull the engine forward until it clears the dowels and the converter snout before lifting. Keep the converter pushed back into the trans.",
          "As a unit (alternative): leave the bellhousing bolted, remove the crossmember, and expect a steep tilt with the trans tail down.",
          "Lift slowly. Watch the distributor, TBI, and firewall. Tilt as needed.",
          "Roll the truck back or the hoist forward once it clears the core support.",
          "Set the combo down on wood blocks. Never leave it hanging on the hoist overnight."
        ],
        warn: "If the engine binds, stop. Something is still connected. Do not pry against the oil pan.",
        tip: "A cheap load leveler saves an hour of fighting the firewall and cowl.",
        photo: true
      }
    ]
  },
  {
    id: "split",
    title: "Phase 2 — Split and Stand",
    blurb: "Separate cleanly, then get the block on a stand.",
    xp: 90,
    steps: [
      {
        id: "separate",
        title: "Engine off the transmission",
        why: "Converter and alignment dowels are easy to wreck if you yank sideways.",
        do: [
          "Engine-only pull: the split already happened in the truck. Lower the trans out from below on a jack with the converter strapped in, then continue with the flexplate and stand items below.",
          "As-a-unit pull: support both pieces, remove the bellhousing bolts, and slide the transmission straight back off the dowels.",
          "Secure the torque converter so it cannot fall out. Strap or converter holding tool.",
          "Inspect the flexplate for cracks at the crank bolts and starter ring wear.",
          "Mount the engine to the stand using the correct bellhousing bolt pattern. Snug all stand bolts."
        ],
        warn: "A converter that walks forward during install later will grenade the pump. Keep it seated on reassembly.",
        tip: "Photo the flexplate orientation and any balance weights before it comes off the crank.",
        photo: true
      }
    ]
  },
  {
    id: "tear",
    title: "Phase 3 — Tear Down",
    blurb: "One system at a time. Label everything that can be reused.",
    xp: 150,
    steps: [
      {
        id: "topend",
        title: "Top end off",
        why: "TBI, intake, and heads tell you if this is a refresh or a full rebuild.",
        do: [
          "Remove TBI and intake. Keep old gaskets as patterns until new ones are on the bench.",
          "Remove valve covers, rockers, and pushrods. Keep pushrods in order if you might reuse them. Note whether the rocker studs are shouldered (non-adjustable) or plain adjustable studs — it changes reassembly.",
          "With the intake off, look at the lifter valley: the 1994 5.7 L05 and 5.0 L03 have a factory hydraulic roller cam, held by a sheet-metal spider and dog-bone lifter guides. Confirm yours.",
          "Unbolt heads in reverse of the tighten sequence. Do not pry on gasket surfaces.",
          "Bag rockers and head bolts by bank and position. Note which head bolt holes are open to the water jacket (wet threads/coolant residue)."
        ],
        warn: "Stock Gen I small-block head bolts are not torque-to-yield and can be reused if clean, straight, and thread-undamaged. Toss any that are rusty, necked, or stretched. Do not mix in leftover bolts of unknown origin.",
        tip: "Look at the pistons through the bores. Heavy scoring means machine shop, not a parts-store ring job.",
        photo: true
      },
      {
        id: "bottom",
        title: "Bottom end and timing",
        why: "Cam, oil pump, and bearings decide whether the crank can stay.",
        do: [
          "Remove water pump, damper (proper puller), and timing cover.",
          "Mark the cam and crank sprocket timing marks before the chain comes off.",
          "Roller cam removal: unbolt the lifter spider (retainer), lift out the dog-bone lifter guides, then pull the roller lifters and keep them in order. Remove the cam thrust plate and slide the cam out without dragging lobes across the bearings.",
          "Inspect roller lifters: rollers should spin smoothly with no flat spots, pits, or loose needles. Replace bad ones as a set.",
          "Remove oil pan, pump, and pickup. Check the pickup screen for bearing glitter.",
          "Number the rod caps. Remove rods/pistons. Number main caps and remove the crank.",
          "Keep bearings in order on a cardboard map so you can read wear later."
        ],
        warn: "Do not beat the damper off with a gear puller on the outer ring. You will wreck the elastomer.",
        tip: "Gold or copper glitter in the pan = bearings are done. Silver flakes can be cam/lifter material.",
        photo: true
      }
    ]
  },
  {
    id: "inspect",
    title: "Phase 4 — Inspect + Budget Parts",
    blurb: "Measure twice. Spend only where the engine will die if you cheap out.",
    xp: 140,
    steps: [
      {
        id: "measure",
        title: "What must be measured",
        why: "Guessing bore wear is how people build an engine that burns oil in 8,000 miles.",
        do: [
          "Bore taper and out-of-round. Ridge at the top of the cylinder.",
          "Crank main and rod journals for score, taper, and out-of-round.",
          "Block deck and head warpage with a straightedge and feeler gauges.",
          "Cam lobe wear and distributor gear condition.",
          "Oil pump backlash/rotor clearance if reusing. Default: replace the pump. It is cheap insurance."
        ],
        warn: "If the block needs more than a hone, stop DIY guessing and talk to a machine shop before ordering pistons.",
        tip: "A local shop hone + pressure test is often cheaper than a second teardown.",
        photo: true
      },
      {
        id: "parts",
        title: "Affordable parts that last",
        why: "Buy quality wear parts. Save money on cosmetics and unnecessary “stage 2” kits.",
        do: [
          "Replace: rings, rod/main bearings, timing chain set, oil pump, freeze plugs, head gaskets, intake gaskets, pan gasket, rear main seal, damper if walked, water pump, thermostat, filters.",
          "Strong budget brands: Sealed Power / Federal-Mogul, Fel-Pro, Melling, Cloyes, Clevite/King, Dura-Bond.",
          "Cam: stay with a hydraulic roller. Reuse the stock cam if lobes and journals are good; if worn, buy a stock-style roller replacement. Good roller lifters can usually be reused on a new roller cam — check with the cam maker.",
          "Avoid swapping to a flat-tappet cam to save money: it needs all-new flat-tappet lifters (never reuse), break-in oil or ZDDP, and a strict break-in run, and you lose the roller's durability.",
          "TBI: new injector pod seals/O-rings, fuel filter, cap/rotor/wires/plugs if tired.",
          "Trans while you are here: filter, pan gasket, cooler flush or new cooler, bushing/seal at tailshaft, fresh converter if the old one dumped debris.",
          "Head bolts: stock Gen I bolts are not torque-to-yield. Reuse if clean and undamaged, or buy a stock-style set if any are rusty or thread-damaged. Aftermarket or TTY-style bolts/studs follow their maker's instructions."
        ],
        warn: "No-name eBay gasket sets and mystery bearings are how a $900 rebuild becomes a $3,000 do-over.",
        tip: "If money is tight: machine the block/heads correctly and use a good overhaul kit. Skip chrome dress-up.",
        photo: true
      }
    ]
  },
  {
    id: "machine",
    title: "Phase 5 — Machine Shop Calls",
    blurb: "Only send out what you cannot measure or cut correctly at home.",
    xp: 70,
    steps: [
      {
        id: "shop",
        title: "What to send vs keep",

}

const STORE_KEY = "c1500-quest-v1";
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch {
    return defaultState();
  }
}
// Everything except photos lives in localStorage. Photos live in IndexedDB (see below).
function save() {
  state.xp = computeXP();
  const out = { ...state };
  if (photoBackend === "idb") delete out.photos;
  else if (photoBackend === "local") out.photos = photoCache; // fallback only when IndexedDB is unavailable
  // while "loading", any legacy state.photos is left untouched until migration finishes
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(out));
    return true;
  } catch (err) {
    console.warn("save failed", err);
    toast("⚠ Could not save progress/notes — browser storage is full or blocked. Export the log (Bay tab) and free up space.", 6000, true);
    return false;
  }
}

let toastTimer = null;
function toast(msg, ms = 1800, isErr = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), ms);
}

// ---- Photo storage: IndexedDB key-value (key = step id, value = array of JPEG data URLs) ----
const IDB_NAME = "c1500-quest", IDB_STORE = "photos";
let photoCache = {};          // in-memory copy, filled before first render
let photoBackend = "loading"; // "loading" | "idb" | "local" (fallback if IndexedDB is unavailable)
let _dbp = null;
function idbOpen() {
  if (_dbp) return _dbp;
  _dbp = new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error("IndexedDB blocked"));
  });
  _dbp.catch(() => { _dbp = null; });
  return _dbp;
}
function idbTx(mode, fn) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, mode);
    const store = tx.objectStore(IDB_STORE);
    let result;
    const r = fn(store);
    if (r) r.onsuccess = () => { result = r.result; };
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("IndexedDB transaction aborted"));
  }));
}
const idb = {
  get: key => idbTx("readonly", s => s.get(key)),
  set: (key, val) => idbTx("readwrite", s => s.put(val, key)),
  del: key => idbTx("readwrite", s => s.delete(key)),
  clear: () => idbTx("readwrite", s => s.clear()),
  // clear + write in ONE transaction: if any write fails, the whole thing rolls back
  replaceAll: obj => idbTx("readwrite", s => { s.clear(); for (const [k, v] of Object.entries(obj)) s.put(v, k); }),
  all: () => idbOpen().then(db => new Promise((resolve, reject) => {
    const out = {};
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } };
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error);
  }))
};

async function initPhotos() {
  const legacy = state.photos && typeof state.photos === "object" ? state.photos : null;
  try {
    const stored = await idb.all();
    // Migrate photos that older versions kept inside the localStorage blob.
    if (legacy && Object.keys(legacy).length) {
      for (const [id, arr] of Object.entries(legacy)) {
        if (!Array.isArray(arr) || !arr.length) continue;
        const merged = [...(stored[id] || []), ...arr.filter(x => !(stored[id] || []).includes(x))].slice(-6);
        await idb.set(id, merged);
        stored[id] = merged;
      }
    }
    photoCache = stored;
    photoBackend = "idb";
    if (legacy) { delete state.photos; save(); } // drop photos from localStorage only after IDB writes succeeded
  } catch (err) {
    console.warn("IndexedDB unavailable, photos fall back to localStorage", err);
    photoBackend = "local";
    photoCache = legacy || {};
    delete state.photos;
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
}
async function putPhotos(id, arr) {
  if (photoBackend === "idb") {
    if (arr.length) await idb.set(id, arr); else await idb.del(id);
    photoCache[id] = arr;
  } else {
    const prev = photoCache[id];
    photoCache[id] = arr;
    if (!save()) { photoCache[id] = prev; throw new Error("storage full"); }
  }
}

function totalSteps() {
  return PHASES.reduce((n, p) => n + p.steps.length, 0);
}
function doneCount() {
  return PHASES.reduce((n, p) => n + p.steps.filter(s => state.done[s.id]).length, 0);
}
// Split a phase's XP across its steps as whole numbers that sum exactly to phase.xp
// (e.g. 80 over 3 steps = 27, 27, 26). Used for display, awards, and the bar max.
function stepXP(phase, step) {
  const n = phase.steps.length, i = phase.steps.indexOf(step);
  const base = Math.floor(phase.xp / n);
  return base + (i < phase.xp % n ? 1 : 0);
}
function computeXP() {
  return PHASES.reduce((sum, p) => sum + p.steps.reduce((a, s) => a + (state.done[s.id] ? stepXP(p, s) : 0), 0), 0);
}
function maxXP() {
  return PHASES.reduce((sum, p) => sum + p.steps.reduce((a, s) => a + stepXP(p, s), 0), 0);
}
function rankName(xp) {
  let name = RANKS[0][1];
  RANKS.forEach(([n, label]) => { if (xp >= n) name = label; });
  return name;
}

function setTab(id) {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  ["home","bay","parts","grok","print","specs","log"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("hidden", t !== id);
  });
  render();
}

document.querySelector(".nav").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.tab === "home") openPhaseId = null; // Quest button always returns to the campaign map
  setTab(b.dataset.tab);
});

function renderHeader() {
  const xp = computeXP();

  document.getElementById("xpFill").style.width = Math.min(100, (xp / maxXP()) * 100) + "%";
  document.getElementById("xpLabel").textContent = xp + " XP · " + doneCount() + "/" + totalSteps() + " steps";
  document.getElementById("rankLabel").textContent = rankName(xp);
}

function dismissStorageNote() {
  state.storageNoteDismissed = true;
  save();
  render();
}

function findNext() {
  for (const phase of PHASES) {
    for (const step of phase.steps) {
      if (!state.done[step.id]) return { phase, step };
    }
  }
  return null;
}

function openPhase(id) {
  openPhaseId = id;
  renderPhase(id);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function closePhase() {
  openPhaseId = null;
  render();
}
function renderPhase(id) {
  const phase = PHASES.find(p => p.id === id);
  const root = document.getElementById("tab-home");
  root.innerHTML = `
    <div class="card">
      <button class="btn ghost" onclick="closePhase()">← Campaign map</button>
      <h2>${phase.title}</h2>
      <p class="sub">${phase.blurb}</p>
    </div>
    ${phase.steps.map(s => renderStep(phase, s, false)).join("")}
  `;
}

function toggleStep(phaseId, stepId, fromBottom) {
  const phase = PHASES.find(p => p.id === phaseId);
  const step = phase.steps.find(s => s.id === stepId);
  const turningOn = !state.done[stepId];
  if (turningOn) state.done[stepId] = true; else delete state.done[stepId];
  const chunk = stepXP(phase, step);
  state.log.unshift({
    t: new Date().toISOString(),
    text: (turningOn ? "Cleared: " : "Reopened: ") + phase.steps.find(s => s.id === stepId).title
  });
  if (save()) toast(turningOn ? `+${chunk} XP` : `Step reopened (−${chunk} XP)`);
  render();
  if (fromBottom && turningOn && !openPhaseId) {
    // bottom button on the Quest spotlight: jump to the top of the next objective instead of leaving you mid-page
    const next = findNext();
    const el = next && document.getElementById("step-" + next.step.id);
    if (el) el.scrollIntoView({ block: "start" });
  }
  if (turningOn && state.autoGrok && state.grokKey) {
    askGrok("I just finished this step: " + phase.steps.find(s => s.id === stepId).title + ". Give the next 3 actions, one likely snag on a 1994 C1500, and any plastic clips I should inspect.", true);
  }
}

function addPhoto(id, input) {
  const file = input.files[0];
  if (!file) return;
  if (photoBackend === "loading") return toast("Photos still loading — try again");
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const max = 900;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL("image/jpeg", 0.7);
      const next = [...(photoCache[id] || [])];
      if (next.length >= 6) next.shift(); // 6 per step cap: oldest drops off
      next.push(data);
      putPhotos(id, next).then(() => {
        state.log.unshift({ t: new Date().toISOString(), text: "Photo added to " + id });
        const ok = save();
        render();
        if (ok) toast("Photo saved on device");
      }).catch(err => {
        console.warn("photo save failed", err);
        toast("⚠ Photo NOT saved — device storage is full or blocked.", 6000, true);
      });
    };
    img.onerror = () => toast("Could not read that image", 3000, true);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function delPhoto(id, i) {
  const next = [...(photoCache[id] || [])];
  next.splice(i, 1);
  putPhotos(id, next).then(render).catch(err => {
    console.warn("photo delete failed", err);
    toast("⚠ Could not delete photo — storage error.", 4000, true);
  });
}

function validateImport(d) {
  if (!d || typeof d !== "object" || Array.isArray(d)) return "not a C1500 Rebuild Quest export";
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  if (!isObj(d.done) || !isObj(d.notes) || !isObj(d.truck) || !Array.isArray(d.log)) return "missing progress, notes, truck, or log data";
  const known = new Set(PHASES.flatMap(p => p.steps.map(s => s.id)));
  const out = { done: {}, notes: {}, truck: { ...defaultState().truck }, log: [], grokChat: [], photos: {} };
  for (const [k, v] of Object.entries(d.done)) if (known.has(k) && v === true) out.done[k] = true;
  for (const [k, v] of Object.entries(d.notes)) if (known.has(k) && typeof v === "string") out.notes[k] = v.slice(0, 20000);
  for (const k of Object.keys(out.truck)) if (typeof d.truck[k] === "string") out.truck[k] = d.truck[k].slice(0, 2000);
  out.log = d.log.filter(x => x && typeof x.text === "string" && typeof x.t === "string").slice(0, 500).map(x => ({ t: x.t, text: x.text.slice(0, 300) }));
  if (Array.isArray(d.grokChat)) out.grokChat = d.grokChat.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.text === "string").slice(-50).map(m => ({ role: m.role, text: m.text }));
  if (d.photos !== undefined && !isObj(d.photos)) return "photos section is malformed";
  for (const [k, arr] of Object.entries(d.photos || {})) {
    if (!known.has(k) || !Array.isArray(arr)) continue;
    const ok = arr.filter(x => typeof x === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x)).slice(-6);
    if (ok.length) out.photos[k] = ok;
  }
  if (typeof d.grokModel === "string") out.grokModel = d.grokModel;
  if (typeof d.autoGrok === "boolean") out.autoGrok = d.autoGrok;
  out.have = {};
  if (isObj(d.have)) for (const [k, v] of Object.entries(d.have)) if (ITEMS[k] && v === true) out.have[k] = true;
  if (isObj(d.partsFilter)) out.partsFilter = { need: d.partsFilter.need === true, opt: d.partsFilter.opt === true, own: d.partsFilter.own === true };
  return out;
}

function importLog(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  if (file.size > 200 * 1024 * 1024) return toast("That file is too large to be an export", 4000, true);
  const reader = new FileReader();
  reader.onerror = () => toast("Could not read that file", 4000, true);
  reader.onload = async () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch { return toast("Import failed: not a valid JSON file", 5000, true); }
    const v = validateImport(parsed);
    if (typeof v === "string") return toast("Import failed: " + v, 5000, true);
    const nPhotos = Object.values(v.photos).reduce((n, a) => n + a.length, 0);
    const nDone = Object.keys(v.done).length;
    if (!confirm(`Replace everything on this phone with this backup?\n\n${nDone} steps done, ${Object.keys(v.notes).length} notes, ${nPhotos} photos.\n\nCurrent progress, notes, and photos will be overwritten.`)) return;
    try {
      if (photoBackend === "idb") {
        await idb.replaceAll(v.photos);
      }
    } catch (err) {
      console.warn("import photos failed", err);
      toast("⚠ Import stopped: could not write photos (storage full or blocked). Nothing on this phone was changed.", 6000, true);
      try { photoCache = await idb.all(); } catch {}
      render();
      return;
    }
    photoCache = v.photos;
    const keep = { grokKey: state.grokKey, storageNoteDismissed: state.storageNoteDismissed };
    const { photos, ...rest } = v;
    state = { ...defaultState(), ...rest, ...keep };
    state.log.unshift({ t: new Date().toISOString(), text: "Imported backup (" + nDone + " steps, " + nPhotos + " photos)" });
    openPhaseId = null;
    if (save()) toast("Backup imported");
    render();
  };
  reader.readAsText(file);
}

async function resetAll() {
  if (!confirm("Reset all progress, notes, and photos on this device?")) return;
  try { if (photoBackend === "idb") await idb.clear(); }
  catch (err) { console.warn(err); toast("⚠ Could not clear photos from storage", 4000, true); }
  photoCache = {};
  state = defaultState();
  openPhaseId = null;

  render();
}

async function askGrok(q, silent) {
  q = (q || "").trim();
  if (!q) return toast("Type a question first");
  if (!state.grokKey) {
    copyContext();
    toast("No API key — context pack copied. Paste it into Grok.");
    return;
  }
  state.grokChat.push({ role: "user", text: q });
  save();
  if (!silent) renderGrok();
  toast("Grok is thinking...");
  const body = {
    model: state.grokModel || "grok-4-fast",
    messages: [
      { role: "system", content: "You are a budget-minded 1988-1998 GMT400 truck engine builder. Use the job context. Give short, ordered steps. Flag safety. Suggest cheap durable parts. If asked for 3D parts, give PETG print settings and dimensions." },
      { role: "user", content: contextPack() + "\n\nQuestion:\n" + q }
    ]
  };
  try {
    const res = await fetch("https://api.x.ai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.grokKey },
      body: JSON.stringify(body)
    });
    let data;
    try { data = await res.json(); } catch { data = { error: { message: "HTTP " + res.status + " with a non-JSON response" } }; }
    if (!res.ok && data && data.error && typeof data.error === "string") data = { error: { message: "HTTP " + res.status + ": " + data.error } };
    const text = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : (data.error && data.error.message) || JSON.stringify(data).slice(0,400);
    state.grokChat.push({ role: "assistant", text });
    state.log.unshift({ t: new Date().toISOString(), text: "Grok: " + q.slice(0,80) });
    save();
    renderGrok();
  } catch (err) {
    state.grokChat.push({ role: "assistant", text: "Could not reach the xAI API (" + err.message + "). This usually means no signal in the garage, a network/content blocker, or opening the app as a local file instead of over https. The xAI API does allow browser calls, so try again with signal, or tap “Copy context pack” and ask in the Grok app instead." });
    save();
    renderGrok();
  }
}

function copyContext() {
  const pack = contextPack() + "\n\nUse this as live job context. Update advice as notes and completed steps change.";
  navigator.clipboard.writeText(pack).then(() => toast("Context copied")).catch(() => toast("Copy failed — export log instead"));
}

function stepList() { return PHASES.flatMap(p => p.steps.map(s => ({ phase: p, step: s }))); }
const FIRST_USE = {}, USED_IN = {};
stepList().forEach(({ phase, step }) => ((STEP_KIT[step.id] || {}).items || []).forEach(id => {

function kitEstimate(stepId) {

function partsTotals() {

        <div><div class="sub">Total (listed)</div><strong id="allTotal">${rng(t.all.lo, t.all.hi)}</strong><div class="sub">${t.all.n} items</div></div>
      </div>
      <div class="sub" id="partsBreakdown">Still need, by type: parts ${rng(t.part.lo, t.part.hi)} · machine shop ${rng(t.service.lo, t.service.hi)} · tools to buy ${rng(t.buy.lo, t.buy.hi)} · rentals ${rng(t.rent.lo, t.rent.hi)}${f.own ? ` · tools you may own ${rng(t.own.lo, t.own.hi)}` : ""}.<br>
        Of that, "replace-if-worn" items are ${rng(t.worn.lo, t.worn.hi)} — skip them if yours measure good.${t.unpriced ? `<br>${t.unpriced} listed item(s) are marked "price not checked" and aren't in the totals.` : ""}<br>
        Machine shop prices vary a lot by region (ranges come from four published price lists).</div>
      <div class="row" style="margin-top:10px">
        <label class="pill"><input type="checkbox" id="fNeed" ${f.need ? "checked" : ""} onchange="setPartsFilter('need', this.checked)"> Still need only</label>
        <label class="pill"><input type="checkbox" id="fOpt" ${f.opt ? "checked" : ""} onchange="setPartsFilter('opt', this.checked)"> Include optional + nice-to-have</label>
        <label class="pill"><input type="checkbox" id="fOwn" ${f.own ? "checked" : ""} onchange="setPartsFilter('own', this.checked)"> Include tools you probably own</label>

// Mesh kit: every primitive is a closed, outward-wound body. Parts are multi-body STLs (overlapping bodies),
// which slicers union automatically. Cavities (tubes, trays) are built directly from walls — no booleans.
function Mesh() { this.t = []; this.bodies = 0; }
Mesh.prototype.tri = function (a, b, c) { this.t.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]); };
Mesh.prototype.quad = function (a, b, c, d) { this.tri(a, b, c); this.tri(a, c, d); };
const SEG = 64; // circle segments (multiple of 4 so bounding boxes hit the exact radius)
function cs(deg) { const r = deg * Math.PI / 180; let c = Math.cos(r), s = Math.sin(r); if (Math.abs(c) < 1e-12) c = 0; if (Math.abs(s) < 1e-12) s = 0; return [c, s]; }
const CIRC = Array.from({ length: SEG }, (_, i) => cs(i * 360 / SEG));
function cp(cx, cy, r, i, z) { const [c, s] = CIRC[i % SEG]; return [cx + r * c, cy + r * s, z]; }
Mesh.prototype.box = function (x0, y0, z0, x1, y1, z1) {
  const p = (x, y, z) => [x, y, z];
  this.quad(p(x0, y0, z0), p(x0, y1, z0), p(x1, y1, z0), p(x1, y0, z0));
  this.quad(p(x0, y0, z1), p(x1, y0, z1), p(x1, y1, z1), p(x0, y1, z1));
  this.quad(p(x0, y0, z0), p(x1, y0, z0), p(x1, y0, z1), p(x0, y0, z1));
  this.quad(p(x0, y1, z0), p(x0, y1, z1), p(x1, y1, z1), p(x1, y1, z0));
  this.quad(p(x0, y0, z0), p(x0, y0, z1), p(x0, y1, z1), p(x0, y1, z0));
  this.quad(p(x1, y0, z0), p(x1, y1, z0), p(x1, y1, z1), p(x1, y0, z1));
  this.bodies++;
};
Mesh.prototype.frustum = function (cx, cy, z0, z1, r0, r1) { // solid cylinder / cone section
  const c0 = [cx, cy, z0], c1 = [cx, cy, z1];
  for (let i = 0; i < SEG; i++) {
    const b0 = cp(cx, cy, r0, i, z0), b1 = cp(cx, cy, r0, i + 1, z0), t0 = cp(cx, cy, r1, i, z1), t1 = cp(cx, cy, r1, i + 1, z1);
    this.quad(b0, b1, t1, t0); this.tri(c0, b1, b0); this.tri(c1, t0, t1);
  }
  this.bodies++;
};
Mesh.prototype.cyl = function (cx, cy, z0, z1, r) { this.frustum(cx, cy, z0, z1, r, r); };
Mesh.prototype.tube = function (cx, cy, z0, z1, ro, ri) {
  for (let i = 0; i < SEG; i++) {
    const O = (k, z) => cp(cx, cy, ro, k, z), I = (k, z) => cp(cx, cy, ri, k, z);
    this.quad(O(i, z0), O(i + 1, z0), O(i + 1, z1), O(i, z1));
    this.quad(I(i, z0), I(i, z1), I(i + 1, z1), I(i + 1, z0));
    this.quad(O(i, z1), O(i + 1, z1), I(i + 1, z1), I(i, z1));
    this.quad(O(i, z0), I(i, z0), I(i + 1, z0), O(i + 1, z0));
  }
  this.bodies++;
};
// C-shaped ring from angle a0 to a1 (degrees), m segments, with flat end caps
Mesh.prototype.sector = function (cx, cy, z0, z1, ro, ri, a0, a1, m) {
  const P = (r, k, z) => { const [c, s] = cs(a0 + (a1 - a0) * k / m); return [cx + r * c, cy + r * s, z]; };
  for (let i = 0; i < m; i++) {
    this.quad(P(ro, i, z0), P(ro, i + 1, z0), P(ro, i + 1, z1), P(ro, i, z1));
    this.quad(P(ri, i, z0), P(ri, i, z1), P(ri, i + 1, z1), P(ri, i + 1, z0));
    this.quad(P(ro, i, z1), P(ro, i + 1, z1), P(ri, i + 1, z1), P(ri, i, z1));
    this.quad(P(ro, i, z0), P(ri, i, z0), P(ri, i + 1, z0), P(ro, i + 1, z0));
  }
  this.quad(P(ro, 0, z0), P(ro, 0, z1), P(ri, 0, z1), P(ri, 0, z0));
  this.quad(P(ro, m, z0), P(ri, m, z0), P(ri, m, z1), P(ro, m, z1));

};
// Open-top box built directly from walls (watertight single body): outer x×y×z, wall w, floor f

  const p = (q, z) => [q[0], q[1], z];
  this.quad(p(O[0], 0), p(O[3], 0), p(O[2], 0), p(O[1], 0));
  for (let k = 0; k < 4; k++) {
    const n = (k + 1) % 4;
    this.quad(p(O[k], 0), p(O[n], 0), p(O[n], Z), p(O[k], Z));
    this.quad(p(O[k], Z), p(O[n], Z), p(I[n], Z), p(I[k], Z));
    this.quad(p(I[k], f), p(I[k], Z), p(I[n], Z), p(I[n], f));
  }
  this.quad(p(I[0], f), p(I[1], f), p(I[2], f), p(I[3], f));
  this.bodies++;
};

const SEGS = ["abcdef", "bc", "abged", "abgcd", "fgbc", "afgcd", "afgedc", "abc", "abcdefg", "abcdfg"];

Mesh.prototype.number = function (n, x, y, W, H, t, zs) {
  const e = 0.05, z0 = zs - 0.2, z1 = zs + 0.6;
  for (const ch of String(n)) {
    const on = SEGS[+ch];
    if (on.includes("d")) this.box(x, y, z0, x + W, y + t, z1);
    if (on.includes("g")) this.box(x, y + H / 2 - t / 2, z0, x + W, y + H / 2 + t / 2, z1);
    if (on.includes("a")) this.box(x, y + H - t, z0, x + W, y + H, z1);
    const lo = [y + t * 0.5, y + H / 2 + 0.05], hi = [y + H / 2 - 0.02, y + H - t * 0.5];
    if (on.includes("e")) this.box(x + e, lo[0], z0, x + e + t, lo[1], z1);
    if (on.includes("f")) this.box(x + e, hi[0], z0, x + e + t, hi[1], z1);
    if (on.includes("c")) this.box(x + W - t - e, lo[0], z0, x + W - e, lo[1], z1);
    if (on.includes("b")) this.box(x + W - t - e, hi[0], z0, x + W - e, hi[1], z1);
    x += W * 1.35;
  }
};

  if (active === "print") renderPrint();
  if (active === "specs") renderSpecs();
  if (active === "log") renderLog();
}

renderHeader();
render(); // renders with photo placeholders; photos fill in once IndexedDB has loaded
initPhotos().finally(render);
</script>
</body>
</html>

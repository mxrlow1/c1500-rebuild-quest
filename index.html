<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071018" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="C1500 Rebuild" />
<link rel="manifest" href="manifest.webmanifest" />

<title>C1500 Rebuild</title>
<style>
  :root {
    --bg: #071018;
    --panel: #101a27;
    --panel2: #162334;
    --line: #26384d;
    --text: #e8f0f7;
    --muted: #8aa0b8;
    --accent: #3ee0a4;
    --accent2: #5aa8ff;
    --warn: #ffb020;
    --danger: #ff6b6b;
    --gold: #f4c95d;
    --shadow: 0 12px 40px rgba(0,0,0,.35);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { max-width: 760px; margin: 0 auto; padding: 16px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: linear-gradient(180deg, #142335, #0d1723); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 20;
  }
  .brand { display: flex; gap: 10px; align-items: center; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: radial-gradient(circle at 30% 30%, #62ffc5, #168a62); display:grid; place-items:center; font-weight:800; color:#052016; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .xpwrap { min-width: 140px; }
  .xpbar { height: 8px; background: #1b2b3c; border-radius: 99px; overflow: hidden; }
  .xpfill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #8cffd3); }
  .xplabel { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
  .nav {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 14px 0;
  }
  .nav button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px;
    color: var(--muted); cursor: pointer; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav button.active { color: #062017; background: var(--accent); border-color: transparent; font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: #1b2d40; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .btn {
    background: var(--accent); color: #052016; border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 800; cursor: pointer;
  }
  .btn.ghost { background: #1b2d40; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.warn { background: var(--warn); color: #2a1b00; }
  .btn.danger { background: #3a1c22; color: #ffb4b4; border: 1px solid #5a2a32; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  select, input[type=text], textarea {
    width: 100%; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
  }
  textarea { min-height: 90px; resize: vertical; }
  .phase { display:flex; justify-content:space-between; gap:10px; align-items:center; padding: 12px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
  .phase h3 { margin: 0; font-size: 15px; }
  .phase p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #1d3348; color: var(--accent); }
  .badge.done { background: #143528; color: #7dffc4; }
  .stephead { display:flex; justify-content:space-between; align-items:flex-start; gap: 10px; }
  .check {
    width: 44px; height: 44px; min-width: 44px; border-radius: 10px; font-size: 20px; border: 2px solid var(--accent); background: transparent; cursor: pointer;
    display:grid; place-items:center; flex: 0 0 auto;
  }
  .check.on { background: var(--accent); color: #052016; font-weight: 900; }
  .warnbox { background: #2a2210; border: 1px solid #5a4618; color: #ffd98a; padding: 10px 12px; border-radius: 12px; font-size: 13px; margin: 10px 0; }
  .tip { background: #102433; border: 1px solid #21435d; color: #b9ddff; padding: 10px 12px; border-radius: 12px; font-size: 13px; margin: 10px 0; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .photos img, .phadd, .phph {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: #0c1622;
  }
  .phadd { display:grid; place-items:center; color: var(--muted); cursor: pointer; font-size: 28px; }
  .phph { display:grid; place-items:center; color: var(--muted); font-size: 12px; }
  .toast.err { background: #3a1c22; color: #ffd0d0; border-color: #7a3440; border-radius: 14px; max-width: 92vw; text-align: center; }
  .hidden { display: none !important; }
  .rank { font-weight: 800; color: var(--gold); }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #123325; color: #c8ffdf; border: 1px solid #2d6a4f; padding: 10px 14px; border-radius: 999px; z-index: 50;
  }
  ul.clean { margin: 8px 0 0 18px; padding: 0; color: #d5e4f1; }
  ul.clean li { margin: 6px 0; }
  .specgrid { font-size: 14px; }
  .logo { flex: 0 0 auto; }
  .stepdone { width: 100%; margin-top: 12px; min-height: 48px; }
  .card[id^="step-"] { scroll-margin-top: 170px; }
  .banner { background: #102433; border: 1px solid #21435d; color: #b9ddff; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 13px; }
  .banner .row { margin-top: 8px; }
  .swtoast { white-space: nowrap; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 90; background: var(--accent); color: #062015; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; box-shadow: var(--shadow); cursor: pointer; }
  .swtoast.hidden { display: none; }
  .backupnag { background: #1d2412; border-color: #4d5d22; color: #e3efc0; }
  .snaprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .snaprow .snapt { font-weight: 600; font-size: 14px; }
  .snaprow .btn { flex: none; }
  .pgood { color: var(--accent); font-weight: 600; }
  .pwarn { color: var(--warn); font-weight: 600; }
  @media (max-width: 400px) { .xpwrap { min-width: 118px; } }
  .nav { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .nav button { font-size: 12px; padding: 12px 0; }
  input[type=number] { width: 100%; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  details.kit { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; }
  details.kit > summary { cursor: pointer; padding: 12px; font-weight: 700; list-style: none; min-height: 44px; display: flex; align-items: center; }
  details.kit > summary::-webkit-details-marker { display: none; }
  details.kit > summary::after { content: "▸"; margin-left: auto; color: var(--muted); }
  details.kit[open] > summary::after { content: "▾"; }
  .kitbody { padding: 0 12px 12px; }
  .prow { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .prow input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
  .prow small { color: var(--muted); display: block; font-size: 12px; margin-top: 3px; line-height: 1.45; }
  .prow.have .pname { opacity: .6; }
  .prow.have .pn { text-decoration: line-through; }
  .pprice { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; color: #d5e4f1; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 99px; background: #1d3348; color: #9fc7ff; margin-right: 4px; white-space: nowrap; }
  .tag.must { background: #3a1c22; color: #ffb4b4; } .tag.worn { background: #2a2210; color: #ffd98a; }
  .tag.optional, .tag.nice { background: #1b2d40; color: var(--muted); } .tag.buy { background: #143528; color: #7dffc4; }
  .tag.rent { background: #1d2a48; color: #a9c4ff; } .tag.own { background: #20262e; color: #b8c4d0; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .totals > div { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .totals strong { font-size: 19px; }
  .btn.sm { padding: 9px 11px; font-size: 13px; min-height: 40px; }
  .helpers { margin: 10px 0; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .fgrid label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .fgrid small { color: #7f95ad; font-size: 11px; display: block; margin-top: 3px; line-height: 1.35; }
  #printCanvas { width: 100%; height: 260px; background: #0c1622; border: 1px solid var(--line); border-radius: 14px; touch-action: none; display: block; cursor: grab; }
  pre.code { white-space: pre-wrap; word-break: break-word; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 12px; max-height: 320px; overflow: auto; }
  .safety { background: #3a1c22; border: 1px solid #7a3440; color: #ffd0d0; padding: 12px; border-radius: 12px; font-size: 13px; margin: 10px 0; }
  .mat { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 13px; }
  /* ---- press-and-hold notes ---- */
  [data-note-id] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  [data-note-id] textarea, [data-note-id] input, [data-note-id] select, [data-note-id] .ntext, .nsheet textarea { -webkit-touch-callout: default; -webkit-user-select: text; user-select: text; }
  .npressing { transform: scale(.985); box-shadow: 0 0 0 2px rgba(62,224,164,.45); border-radius: 12px; transition: transform .34s cubic-bezier(.23,1,.32,1), box-shadow .34s; }
  .nflash { animation: nflash 1.5s cubic-bezier(.23,1,.32,1); border-radius: 12px; }
  @keyframes nflash { 0%, 45% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }
  .nbadge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 99px; background: #1d3348; font-size: 11px; line-height: 18px; vertical-align: middle; text-decoration: none; }
  .nextras { display: grid; gap: 6px; margin: 6px 0 4px; }
  .ntext { font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .nchip { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #123325; border: 1px solid #2d6a4f; color: #c8ffdf; border-radius: 12px; padding: 7px 8px 7px 10px; font-size: 13px; }
  .nchip b { color: var(--accent); }
  .nundo { flex: 0 0 auto; background: #1b2d40; color: var(--text); border: 1px solid var(--line); border-radius: 10px; min-height: 36px; padding: 0 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .nadd { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 13px; color: #d5e4f1; }
  .nadd .nhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .nlabel { font-size: 11px; font-weight: 700; color: var(--accent); }
  .nadd.warning .nlabel { color: var(--warn); }
  .nadd p { margin: 4px 0 0; }
  .nbusy { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: 0 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .nerr { background: #3a1c22; border: 1px solid #5a2a32; color: #ffd0d0; border-radius: 12px; padding: 8px 10px; font-size: 12px; }
  .nerr .row { margin-top: 6px; }
  .lskip { text-decoration: line-through; color: var(--muted); }
  .ltag { font-size: 11px; color: var(--muted); margin-left: 6px; text-decoration: none; display: inline-block; }
  .nsheet-wrap { position: fixed; inset: 0; background: rgba(7,16,24,.82); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .nsheet { width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); box-shadow: var(--shadow); animation: nsheet .25s cubic-bezier(.23,1,.32,1); max-height: 92vh; overflow: auto; }
  @keyframes nsheet { from { transform: translateY(24px); opacity: 0; } }
  .nsheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
  .nsheet h3 { margin: 2px 0 0; font-size: 18px; }
  .nsheet textarea { margin-top: 10px; font-size: 16px; min-height: 110px; }
  .nsheet .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .nsheet details { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .nsheet details li { margin: 4px 0; }
  /* ---- More info ---- */
  .nseg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-top: 10px; }
  .nseg button { background: transparent; border: 0; border-radius: 9px; min-height: 38px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; }
  .nseg button[aria-selected=true] { background: var(--accent); color: #052016; }
  .isec { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 10px; font-size: 13px; color: #d5e4f1; overflow-wrap: anywhere; }
  .isec.warnish { border-color: #4a3b17; } .isec.warnish .ihead { color: var(--warn); }
  .isec.danger { background: #2a1519; border-color: #5a2a32; color: #ffd0d0; } .isec.danger .ihead { color: #ffb4b4; }
  .ihead { font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .ip { margin: 4px 0 0; line-height: 1.45; }
  .ilist { margin: 4px 0 0 18px; padding: 0; } .ilist li { margin: 4px 0; line-height: 1.4; }
  .ilist a, .isec .sub a { color: #a9c4ff; }
  .ikv { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 5px 10px; align-items: baseline; }
  .ilinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ichips { display: flex; flex-wrap: wrap; gap: 6px; }
  .nlink { display: inline-flex; align-items: center; gap: 4px; min-height: 38px; padding: 0 11px; border-radius: 10px; background: #1b2d40; border: 1px solid var(--line); color: var(--text); font-size: 13px; font-weight: 600; text-decoration: none; max-width: 100%; text-align: left; cursor: pointer; font-family: inherit; }
  .nlink.used { background: #2a2210; border-color: #4a3b17; color: #ffd98a; }
  .nlink.ijump { color: #7dffc4; }
  .ians { margin-top: 8px; line-height: 1.5; background: #0c1622; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .ians p { margin: 4px 0; } .ians ul { margin: 4px 0 4px 18px; padding: 0; } .ians li { margin: 3px 0; }
  .ians-h { font-weight: 800; color: var(--accent); margin-top: 8px !important; }
  .nhint { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .noterow { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .noterow .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .noterow h4 { margin: 2px 0 0; font-size: 14px; }
  .prow-wrap .nextras { margin-left: 38px; }
  .specrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 7px 0; border-top: 1px solid var(--line); }
  .specrow:first-child { border-top: 0; }
  .specrow > span:first-child { color: var(--muted); }
  .specrow .nextras { grid-column: 1 / -1; }
  .bayfield { margin-bottom: 10px; }
  .bayfield > label.sub { display: block; padding: 6px 0 4px; }
  .ptpl { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 10px; }

  /* ================= UX pass (v6): bigger text + targets, bottom nav, calmer screens ================= */
  body { font-size: 16px; line-height: 1.45; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .app { padding: 12px 12px 20px; }
  .sub { font-size: 14px; }
  header.top { position: static; padding: 10px 14px; gap: 10px; margin-bottom: 12px; }
  header.top h1 { font-size: 17px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; font-size: 14px; }
  .logo { font-size: 21px; }
  .proglabel { font-size: 14px; color: var(--muted); }
  .progwrap { flex: 0 0 96px; text-align: right; }
  .progpct { font-size: 17px; font-weight: 800; color: var(--accent); line-height: 1.2; margin-bottom: 4px; }
  .progbar { height: 8px; background: #1b2b3c; border-radius: 99px; overflow: hidden; }
  .progfill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #8cffd3); transition: width .3s; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;
    background: #0b1520; border-top: 1px solid var(--line); padding: 4px 6px env(safe-area-inset-bottom); }
  .nav button { background: transparent; border: 0; border-radius: 12px; min-height: 60px; padding: 6px 2px; font-size: 13px; font-weight: 700; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .nav button .ni { font-size: 21px; line-height: 1; }
  .nav button.active { background: #13301f; color: var(--accent); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .swtoast { bottom: calc(148px + env(safe-area-inset-bottom)); }
  .subhead { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .subhead strong { font-size: 18px; }
  .card { padding: 16px 14px; }
  .card h2 { font-size: 22px; margin: 8px 0; }
  .card p, ul.clean { font-size: 16px; }
  ul.clean li { margin: 8px 0; line-height: 1.45; }
  .btn { min-height: 48px; font-size: 16px; }
  .btn.sm { min-height: 48px; font-size: 15px; padding: 10px 14px; }
  .banner { font-size: 15px; line-height: 1.45; }
  .warnbox, .tip, .safety { font-size: 15px; line-height: 1.45; }
  .phase { padding: 12px; min-height: 64px; }
  .phase h3 { font-size: 17px; }
  .phase p { font-size: 14px; }
  .badge { font-size: 13px; padding: 4px 9px; white-space: nowrap; }
  .tag { font-size: 13px; padding: 2px 8px; }
  .pill { font-size: 14px; }
  .check { width: 48px; height: 48px; min-width: 48px; border-radius: 12px; }
  select, input[type=text], input[type=password], input[type=number], textarea { font-size: 16px; min-height: 48px; }
  /* step cards */
  .nextlabel { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: #062017; background: var(--accent); border-radius: 99px; padding: 3px 10px; margin-bottom: 8px; }
  .card.spotlight { border-color: #2d6a4f; box-shadow: 0 0 0 1px #2d6a4f, var(--shadow); }
  .stephead h3 { font-size: 20px; line-height: 1.25; }
  .stepbtns { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
  .why { color: #d5e4f1; margin: 10px 0 4px; }
  .todo-h { font-size: 13px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
  details.stepmore { margin-top: 12px; border-top: 1px solid var(--line); }
  details.stepmore > summary { list-style: none; cursor: pointer; min-height: 52px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); padding: 4px 0; }
  details.stepmore > summary::-webkit-details-marker { display: none; }
  details.stepmore > summary::after { content: "Show ▾"; margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 600; }

const IDB_NAME = "c1500-quest", IDB_STORE = "photos";

    req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } };

async function initPhotos() {
  const legacy = state.photos && typeof state.photos === "object" ? state.photos : null;
  try {
    const stored = await idb.all();
    // Migrate photos that older versions kept inside the localStorage blob.
    if (legacy && Object.keys(legacy).length) {
      for (const [id, arr] of Object.entries(legacy)) {
        if (!Array.isArray(arr) || !arr.length) continue;
        const merged = [...(stored[id] || []), ...arr.filter(x => !(stored[id] || []).includes(x))].slice(-6);
        await idb.set(id, merged);
        stored[id] = merged;
      }
    }
    photoCache = stored;
    photoBackend = "idb";
    if (legacy) { delete state.photos; save(); } // drop photos from localStorage only after IDB writes succeeded
  } catch (err) {
    console.warn("IndexedDB unavailable, photos fall back to localStorage", err);

    photoCache[id] = arr;

    req.onsuccess = () => { const c = req.result; if (c) { out.push(c.value); c.continue(); } };

function snapKeepIds(list, now = Date.now()) {

function takeSnapshot(reason = "auto", opts = {}) {

    if (!opts.force && !hasProgress()) return null;
    const data = snapData();
    const refs = Object.fromEntries(Object.entries(photoCache).filter(([, a]) => Array.isArray(a) && a.length).map(([k, a]) => [k, a.length]));
    const hash = hashStr(JSON.stringify(data) + JSON.stringify(refs));
    if (!opts.force && hash === lastSnapHash) return null; // nothing changed since the last snapshot
    const size = Object.values(photoCache).reduce((n, a) => n + (Array.isArray(a) ? a.reduce((m, x) => m + x.length, 0) : 0), 0);

// Share sheet where the phone supports sharing files (Android/iOS), plain download everywhere else.
async function saveBackupFile() {
  const json = await exportPayload();
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const name = `c1500-rebuild-quest-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  let file = null;
  try { file = new File([json], name, { type: "application/json" }); } catch {}
  if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "C1500 Rebuild backup" });
      markExported(); render(); toast("Backup saved");
      return "shared";
    } catch (err) {
      if (err && err.name === "AbortError") return "cancelled"; // closed the share sheet: keep the reminder
      console.warn("share failed, downloading instead", err);
    }
  }
  downloadJson(json, name);
  markExported(); render(); toast("Backup file downloaded");
  return "downloaded";
}
async function initBackups() {
  if (!state.firstProgressAt && hasProgress()) {
    // older saves: date progress from the oldest log entry
    const ts = (state.log || []).map(x => Date.parse(x.t)).filter(Number.isFinite);
    state.firstProgressAt = ts.length ? Math.min(...ts) : Date.now();
    save();
  }
  askPersist();
  if (photoBackend === "idb") {
    try { const newest = (await snapIdb.all())[0]; lastSnapHash = newest ? newest.hash : null; } catch {}
  }
  setInterval(() => takeSnapshot("auto"), SNAP_EVERY);

}

function totalSteps() {
  return PHASES.reduce((n, p) => n + p.steps.length, 0);
}
function doneCount() {
  return PHASES.reduce((n, p) => n + p.steps.filter(s => state.done[s.id]).length, 0);
}
// Split a phase's XP across its steps as whole numbers that sum exactly to phase.xp
// (e.g. 80 over 3 steps = 27, 27, 26). Used for display, awards, and the bar max.
function stepXP(phase, step) {
  const n = phase.steps.length, i = phase.steps.indexOf(step);
  const base = Math.floor(phase.xp / n);
  return base + (i < phase.xp % n ? 1 : 0);
}
function computeXP() {
  return PHASES.reduce((sum, p) => sum + p.steps.reduce((a, s) => a + (state.done[s.id] ? stepXP(p, s) : 0), 0), 0);
}
function maxXP() {
  return PHASES.reduce((sum, p) => sum + p.steps.reduce((a, s) => a + stepXP(p, s), 0), 0);
}
function rankName(xp) {
  let name = RANKS[0][1];
  RANKS.forEach(([n, label]) => { if (xp >= n) name = label; });
  return name;
}

function addPhoto(id, input) {
  const file = input.files[0];
  if (!file) return;
  if (photoBackend === "loading") return toast("Photos still loading — try again");
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const max = 900;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL("image/jpeg", 0.7);
      const next = [...(photoCache[id] || [])];
      if (next.length >= 6) next.shift(); // 6 per step cap: oldest drops off
      next.push(data);
      putPhotos(id, next).then(() => {
        state.log.unshift({ t: new Date().toISOString(), text: "Photo added to " + id });
        const ok = save();
        render();
        if (ok) toast("Photo saved on device");
      }).catch(err => {
        console.warn("photo save failed", err);
        toast("⚠ Photo NOT saved — device storage is full or blocked.", 6000, true);
      });
    };
    img.onerror = () => toast("Could not read that image", 3000, true);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function delPhoto(id, i) {
  const next = [...(photoCache[id] || [])];
  next.splice(i, 1);
  putPhotos(id, next).then(render).catch(err => {
    console.warn("photo delete failed", err);
    toast("⚠ Could not delete photo — storage error.", 4000, true);
  });
}

function validateImport(d) {
  if (!d || typeof d !== "object" || Array.isArray(d)) return "not a C1500 Rebuild backup file";
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  if (!isObj(d.done) || !isObj(d.notes) || !isObj(d.truck) || !Array.isArray(d.log)) return "missing progress, notes, truck, or log data";
  const known = new Set(PHASES.flatMap(p => p.steps.map(s => s.id)));
  const out = { done: {}, notes: {}, truck: { ...defaultState().truck }, log: [], grokChat: [], photos: {} };
  for (const [k, v] of Object.entries(d.done)) if (known.has(k) && v === true) out.done[k] = true;
  for (const [k, v] of Object.entries(d.notes)) if (known.has(k) && typeof v === "string") out.notes[k] = v.slice(0, 20000);
  for (const k of Object.keys(out.truck)) if (typeof d.truck[k] === "string") out.truck[k] = d.truck[k].slice(0, 2000);
  out.log = d.log.filter(x => x && typeof x.text === "string" && typeof x.t === "string").slice(0, 500).map(x => ({ t: x.t, text: x.text.slice(0, 300) }));
  if (Array.isArray(d.grokChat)) out.grokChat = d.grokChat.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.text === "string").slice(-50).map(m => ({ role: m.role, text: m.text }));
  if (d.photos !== undefined && !isObj(d.photos)) return "photos section is malformed";
  for (const [k, arr] of Object.entries(d.photos || {})) {
    if (!known.has(k) || !Array.isArray(arr)) continue;
    const ok = arr.filter(x => typeof x === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x)).slice(-6);
    if (ok.length) out.photos[k] = ok;
  }

  if (isObj(d.itemNotes)) for (const [k, n] of Object.entries(d.itemNotes)) {
    if (!isObj(n) || typeof n.text !== "string" || !n.text.trim() || !parseTarget({ id: k, step: typeof n.step === "string" ? n.step : undefined })) continue;
    out.itemNotes[k] = { text: n.text.slice(0, 2000), t: typeof n.t === "string" ? n.t : new Date().toISOString(), title: typeof n.title === "string" ? n.title.slice(0, 120) : k, ...(typeof n.step === "string" ? { step: n.step } : {}) };
  }
  if (isObj(d.checks)) for (const [k, v] of Object.entries(d.checks)) if (v === true && typeof k === "string" && k.length < 120) out.checks[k] = true;
  const num = v => typeof v === "number" && Number.isFinite(v) && v >= 0 && v <= 20000;
  if (isObj(d.adjust)) {
    if (isObj(d.adjust.price)) for (const [k, v] of Object.entries(d.adjust.price)) if (ITEMS[k] && num(v)) out.adjust.price[k] = v;
    if (isObj(d.adjust.skip)) for (const [k, v] of Object.entries(d.adjust.skip)) if (v === true && (ITEMS[k] || parseTarget({ id: k }))) out.adjust.skip[k] = true;
    if (Array.isArray(d.adjust.added)) for (const e of d.adjust.added.slice(0, 200)) {
      if (!isObj(e) || typeof e.id !== "string" || typeof e.target !== "string" || typeof e.text !== "string" || !e.text.trim()) continue;

  if (Array.isArray(d.changes)) out.changes = d.changes.slice(0, 60).filter(c => isObj(c) && typeof c.id === "string" && typeof c.target === "string" && Array.isArray(c.ops))
    .map(c => ({ id: c.id, target: c.target, source: c.source === "grok" ? "grok" : "local", summary: typeof c.summary === "string" ? c.summary.slice(0, 240) : "", t: typeof c.t === "string" ? c.t : "",

function importLog(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  if (file.size > 200 * 1024 * 1024) return toast("That file is too large to be an export", 4000, true);
  const reader = new FileReader();
  reader.onerror = () => toast("Could not read that file", 4000, true);
  reader.onload = async () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch { return toast("Import failed: not a valid JSON file", 5000, true); }
    const v = validateImport(parsed);
    if (typeof v === "string") return toast("Import failed: " + v, 5000, true);
    const nPhotos = Object.values(v.photos).reduce((n, a) => n + a.length, 0);
    const nDone = Object.keys(v.done).length;
    if (!confirm(`Replace everything on this phone with this backup?\n\n${nDone} steps done, ${Object.keys(v.notes).length} notes, ${nPhotos} photos.\n\nCurrent progress, notes, and photos will be overwritten.`)) return;
    await takeSnapshot("before import");
    try {
      if (photoBackend === "idb") {
        await idb.replaceAll(v.photos);
      }
    } catch (err) {
      console.warn("import photos failed", err);
      toast("⚠ Import stopped: could not write photos (storage full or blocked). Nothing on this phone was changed.", 6000, true);
      try { photoCache = await idb.all(); } catch {}
      render();
      return;
    }
    photoCache = v.photos;
    const keep = { grokKey: state.grokKey, storageNoteDismissed: state.storageNoteDismissed, noteHintSeen: state.noteHintSeen || !!v.noteHintSeen,
      lastExportAt: state.lastExportAt, backupNagUntil: state.backupNagUntil, firstProgressAt: state.firstProgressAt || Date.now() };
    noteBusy = {}; infoBusy = {};
    const { photos, ...rest } = v;
    state = { ...defaultState(), ...rest, ...keep };
    state.log.unshift({ t: new Date().toISOString(), text: "Imported backup (" + nDone + " steps, " + nPhotos + " photos)" });
    openPhaseId = null;
    if (save()) toast("Backup imported");
    render();
  };
  reader.readAsText(file);
}

async function resetAll() {
  if (!confirm("Reset all progress, notes, and photos on this device?")) return;
  await takeSnapshot("before reset"); // a way back from a mis-tap (Bay → Backups)
  try { if (photoBackend === "idb") await idb.clear(); }
  catch (err) { console.warn(err); toast("⚠ Could not clear photos from storage", 4000, true); }
  photoCache = {};
  state = defaultState();
  noteBusy = {}; infoBusy = {};
  openPhaseId = null;
  if (save()) toast("Progress reset");
  render();
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function contextPack() {
  const done = Object.keys(state.done).filter(k => state.done[k]);
  const notes = Object.entries(state.notes).filter(([,v]) => v && v.trim()).map(([k,v]) => k + ": " + v).join("\n");
  const next = findNext();
  return [
    "Truck: 1994 Chevy C1500",
    "Engine: " + state.truck.engine,
    "Drive: " + state.truck.drive,
    "Trans: " + state.truck.trans,
    "Miles/symptoms: " + (state.truck.miles || "n/a"),
    "Completed steps: " + (done.join(", ") || "none"),
    "Current step: " + (next ? next.step.title : "all steps done"),
    "Field notes:\n" + (notes || "none")
  ].join("\n");
}

let grokSettingsOpen = false;
function renderGrok() {
  const root = document.getElementById("tab-grok");
  const chat = (state.grokChat || []).slice(-12).map(m =>
    `<div class="phase"><div><h3 style="font-size:13px">${m.role === "user" ? "You" : "Grok"}</h3><p style="white-space:pre-wrap;color:#d5e4f1">${esc(m.text)}</p></div></div>`
  ).join("") || "<p class='sub'>Nothing asked yet.</p>";
  const setOpen = grokSettingsOpen || !state.grokKey;
  grokSettingsOpen = false;
  root.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">Ask Grok</h2>
      <label class="sub" for="grokQ">Ask about the job you're on</label>

      <div class="row" style="margin-top:10px">

      </div>
      ${state.grokKey ? "" : `<p class="sub">Grok needs an xAI key to answer here. No key? “Copy for the Grok app” copies your truck and step so you can paste it into the Grok app.</p>`}
    </div>
    <div class="card">
      <details class="plain" id="grokSettings" ${setOpen ? "open" : ""}><summary>Grok settings${state.grokKey ? " (key saved)" : ""}</summary>

      <label class="sub">xAI API key</label>
      <input type="password" id="grokKey" value="${esc(state.grokKey)}" placeholder="xai-..." onchange="state.grokKey=this.value; save();" />
      <div style="height:8px"></div>
      <label class="sub">Model</label>
      <select onchange="state.grokModel=this.value; save();">
        ${["grok-4-fast","grok-4","grok-4.5"].map(m => `<option ${state.grokModel===m?"selected":""}>${m}</option>`).join("")}
      </select>
      <div class="row" style="margin-top:10px;align-items:center">
        <label class="pill"><input type="checkbox" ${state.autoGrok?"checked":""} onchange="state.autoGrok=this.checked; save();"> Auto-ask after each checked step</label>
      </div>
      <p class="sub">Get a key at console.x.ai. Asking needs an internet connection; with no signal, copy it for the Grok app and paste it later.</p>

      ${chat}
    </div>
  `;
}

async function askGrok(q, silent) {
  q = (q || "").trim();
  if (!q) return toast("Type a question first");
  if (!state.grokKey) {
    copyContext();
    toast("No API key — context pack copied. Paste it into Grok.");
    return;
  }
  state.grokChat.push({ role: "user", text: q });
  save();
  if (!silent) renderGrok();
  toast("Grok is thinking...");
  const body = {
    model: state.grokModel || "grok-4-fast",
    messages: [
      { role: "system", content: "You are a budget-minded 1988-1998 GMT400 truck engine builder. Use the job context. Give short, ordered steps. Flag safety. Suggest cheap durable parts. If asked for 3D parts, give PETG print settings and dimensions." },
      { role: "user", content: contextPack() + "\n\nQuestion:\n" + q }
    ]
  };
  try {
    const res = await fetch("https://api.x.ai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.grokKey },
      body: JSON.stringify(body)
    });
    let data;
    try { data = await res.json(); } catch { data = { error: { message: "HTTP " + res.status + " with a non-JSON response" } }; }
    if (!res.ok && data && data.error && typeof data.error === "string") data = { error: { message: "HTTP " + res.status + ": " + data.error } };
    const text = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : (data.error && data.error.message) || JSON.stringify(data).slice(0,400);
    state.grokChat.push({ role: "assistant", text });
    state.log.unshift({ t: new Date().toISOString(), text: "Grok: " + q.slice(0,80) });
    save();
    renderGrok();
  } catch (err) {
    state.grokChat.push({ role: "assistant", text: "Could not reach the xAI API (" + err.message + "). This usually means no signal in the garage, a network/content blocker, or opening the app as a local file instead of over https. The xAI API does allow browser calls, so try again with signal, or tap “Copy context pack” and ask in the Grok app instead." });
    save();
    renderGrok();
  }
}

function copyContext() {
  const pack = contextPack() + "\n\nUse this as live job context. Update advice as notes and completed steps change.";
  navigator.clipboard.writeText(pack).then(() => toast("Context copied")).catch(() => toast("Copy failed — export log instead"));
}

// Mesh kit: every primitive is a closed, outward-wound body. Parts are multi-body STLs (overlapping bodies),

function Mesh() { this.t = []; this.bodies = 0; }

  this.quad(p(x0, y1, z0), p(x0, y1, z1), p(x1, y1, z1), p(x1, y1, z0));

const SEGS = ["abcdef", "bc", "abged", "abgcd", "fgbc", "afgcd", "afgedc", "abc", "abcdefg", "abcdfg"];

  const e = 0.05, z0 = zs - 0.2, z1 = zs + 0.6;
  for (const ch of String(n)) {
    const on = SEGS[+ch];
    if (on.includes("d")) this.box(x, y, z0, x + W, y + t, z1);
    if (on.includes("g")) this.box(x, y + H / 2 - t / 2, z0, x + W, y + H / 2 + t / 2, z1);
    if (on.includes("a")) this.box(x, y + H - t, z0, x + W, y + H, z1);

    if (on.includes("f")) this.box(x + e, hi[0], z0, x + e + t, hi[1], z1);
    if (on.includes("c")) this.box(x + W - t - e, lo[0], z0, x + W - e, lo[1], z1);
    if (on.includes("b")) this.box(x + W - t - e, hi[0], z0, x + W - e, hi[1], z1);

}

async function runNoteGrok(ref, text) {

  if (noteBusy[ref.id] && noteBusy[ref.id].state === "busy") return;
  noteBusy[ref.id] = { state: "busy" };
  render();
  const fail = (message) => { noteBusy[ref.id] = { state: "error", message }; render(); };

  try {
    reply = await callXaiJson([{ role: "system", content: ADJUST_SYSTEM }, { role: "user", content: noteContext(ref, text) }]);
  } catch (err) {

  }
  const raw = parsePlanText(reply);
  if (raw === null) return fail("Grok's reply was not valid JSON, so nothing from it was applied.");
  const plan = validatePlan(raw, t);
  if (!plan.actions.length && plan.dropped && !plan.summary) return fail("Grok's reply did not match the changes this app allows, so nothing from it was applied.");
  const r = applyActions({ ...t, id: ref.id }, plan.actions);
  const summary = (r.ops.length ? sentence(r.words) : plan.summary || "Grok read the note. Nothing needed changing.") +
    (plan.dropped ? ` (${plan.dropped} invalid change${plan.dropped === 1 ? "" : "s"} ignored)` : "");
  recordChange(ref.id, "grok", summary, r.ops);

    const el = document.querySelector(`[data-note-id="${CSS.escape(id)}"]`);
    if (!el) return toast(kind === "item" ? "That item is hidden by a Parts filter" : "Could not find that item");
    for (let p = el.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") { p.open = true; if (p.id && p.id.startsWith("kit-")) openKits.add(p.id.slice(4)); }
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.remove("nflash"); void el.offsetWidth; el.classList.add("nflash");
    setTimeout(() => el.classList.remove("nflash"), 1600);
  });
}

// ---- the long-press listener (one, delegated) ----
(function installLongPress() {
  const HOLD = 500, SLOP = 10;
  const EDITABLE = "textarea, select, input:not([type=checkbox]):not([type=radio]), [contenteditable=true], .ntext, #printCanvas, .nsheet";
  let timer = 0, pressT = 0, start = null, pressed = null, fired = false, swallowUntil = 0, openedAt = 0, openedEl = null;
  const refOf = el => ({ id: el.dataset.noteId, title: el.dataset.noteTitle || el.dataset.noteId, ...(el.dataset.noteStep ? { step: el.dataset.noteStep } : {}) });
  const clear = () => { clearTimeout(timer); clearTimeout(pressT); if (pressed) pressed.classList.remove("npressing"); pressed = null; start = null; };
  const open = el => { openedAt = Date.now(); openedEl = el; openNoteSheet(refOf(el)); };
  document.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const tg = e.target;
    if (!tg || !tg.closest || tg.closest(EDITABLE) || noteSheetRef) return;
    const el = tg.closest("[data-note-id]");
    if (!el) return;
    clear(); fired = false;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId }; pressed = el;
    pressT = setTimeout(() => el.classList.add("npressing"), 160);
    timer = setTimeout(() => {
      fired = true; el.classList.remove("npressing");
      try { if (navigator.vibrate) navigator.vibrate(15); } catch {}
      open(el); start = null;
    }, HOLD);
  }, true);
  document.addEventListener("pointermove", e => {
    if (!start || e.pointerId !== start.id) return;
    if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > SLOP) clear();
  }, true);
  let swallowAt = null;
  document.addEventListener("pointerup", e => { if (fired) { swallowUntil = Date.now() + 450; swallowAt = { x: e.clientX, y: e.clientY }; } fired = false; clear(); }, true);
  document.addEventListener("pointercancel", () => { fired = false; clear(); }, true);
  window.addEventListener("scroll", () => { fired = false; clear(); }, { capture: true, passive: true });
  // swallow only the click that ends the hold (same spot, once)
  document.addEventListener("click", e => {
    if (Date.now() >= swallowUntil) return;
    const near = !swallowAt || Math.hypot(e.clientX - swallowAt.x, e.clientY - swallowAt.y) <= 24;
    // (the Note | More info switch counts as "the same spot": lifting the finger must not flip the tab)
    // (one-shot, even when a sheet button now sits under the finger: lifting must never press it)
    if (!near) return;
    swallowUntil = 0; e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener("contextmenu", e => {
    const tg = e.target;
    if (!tg || !tg.closest || tg.closest(EDITABLE)) return;
    const el = tg.closest("[data-note-id]");
    if (!el) return;
    e.preventDefault();
    // a touch long-press also fires contextmenu on the same element: don't reopen what the hold just opened
    if ((Date.now() - openedAt < 900 && el === openedEl) || noteSheetRef) return;
    clear(); open(el);
  }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && noteSheetRef) closeNoteSheet(); });
})();

function render() {
  renderHeader();
  const active = currentTab;
  if (active === "more") renderMore();
  if (active === "home") renderHome();
  if (active === "bay") renderBay();
  if (active === "parts") renderParts();
  if (active === "grok") renderGrok();
  if (active === "print") renderPrint();
  if (active === "specs") renderSpecs();
  if (active === "log") renderLog();
}

// ---- Install/offline: service worker + "Updated, tap to reload" ----
(function registerSW() {
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  let wantReload = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (wantReload) location.reload(); });
  const offer = reg => {
    const w = reg.waiting;
    if (!w || !navigator.serviceWorker.controller) return; // first install: nothing to reload
    const el = document.getElementById("swToast");
    el.classList.remove("hidden");
    el.onclick = () => { wantReload = true; el.textContent = "Reloading…"; w.postMessage("skipWaiting"); };
  };
  const go = () => navigator.serviceWorker.register("sw.js").then(reg => {
    offer(reg);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (nw) nw.addEventListener("statechange", () => { if (nw.state === "installed") offer(reg); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(err => console.warn("service worker not registered", err));
  if (document.readyState === "complete") go(); else window.addEventListener("load", go);
})();

renderHeader();
render(); // renders with photo placeholders; photos fill in once IndexedDB has loaded
initPhotos().finally(() => { render(); initBackups(); });
</script>
